name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Canary until a stable Bun ships `bun lint` (ADR 36). Releases build on
      # stable: see release.yml.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - uses: extractions/setup-just@v3

      - run: bun install --frozen-lockfile

      - name: Lint, typecheck, test
        run: just checkall

      # `just lint` formats and fixes in place, so a clean run changes nothing.
      - name: Formatted and lint-fixed
        run: git diff --exit-code

      - name: Bundle
        run: just bundle

      - name: Smoke test the bundle
        run: |
          ./dist/infer.js --version
          ./dist/infer.js --help
          ./dist/infer.js keys list

      - uses: actions/upload-artifact@v4
        with:
          name: infer.js
          path: dist/infer.js
          if-no-files-found: error
